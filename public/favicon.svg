<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="tv-primary" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#2563EB"/>
      <stop offset="100%" stopColor="#38BDF8"/>
    </linearGradient>
    <linearGradient id="tv-emerald" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#38BDF8"/>
      <stop offset="100%" stopColor="#10B981"/>
    </linearGradient>
  </defs>

  <!-- Hexagonal Boundary Shield -->
  <polygon points="32,6 54,18 54,46 32,58 10,46 10,18" stroke="url(#tv-primary)" stroke-width="2.5" stroke-linejoin="round" fill="#080C14"/>

  <!-- Orbital Rings -->
  <circle cx="32" cy="32" r="19" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.6"/>

  <!-- Futuristic Central 'T' Lattice -->
  <path d="M18 20 L46 20" stroke="url(#tv-primary)" stroke-width="4" stroke-linecap="round"/>
  <path d="M32 20 L32 46" stroke="url(#tv-primary)" stroke-width="4" stroke-linecap="round"/>
  <path d="M18 20 L25 33 L32 46 L39 33 L46 20" stroke="url(#tv-emerald)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Connected Vertices -->
  <circle cx="18" cy="20" r="3.5" fill="#2563EB"/>
  <circle cx="46" cy="20" r="3.5" fill="#38BDF8"/>
  <circle cx="32" cy="20" r="2.8" fill="#FFFFFF"/>
  <circle cx="25" cy="33" r="2.8" fill="#38BDF8"/>
  <circle cx="39" cy="33" r="2.8" fill="#2563EB"/>
  <circle cx="32" cy="46" r="3.5" fill="#10B981"/>
</svg>